[package]
name = "learnwhile"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
fsrs = "6.6.1"
ratatui = "0.30.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
tempfile = { version = "3.27.0", optional = true }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[profile.release]
# Tuned for a locally-installed CLI: a well-optimized, stripped binary loads fast, and binary size
# is explicitly not a concern (ADR-0008) — startup time is. `panic` stays the default `unwind`,
# NOT `abort`: the hook path relies on `catch_unwind` to exit 0 on a panic (ADR-0004), which
# `panic = "abort"` would break.
lto = "thin"
codegen-units = 1
strip = true

[features]
# The `spawn_test_host` harness. Off by default so the shipped binary carries no test scaffolding;
# enabled for integration tests via the self dev-dependency below.
testing = ["dep:tempfile"]

[dev-dependencies]
assert_cmd = "2.2.2"
learnwhile = { path = ".", features = ["testing"] }
tempfile = "3.27.0"
